<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benchmarking de Productividad y PTF - Perú</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="max-w-7xl mx-auto px-4 py-8" x-data="diagnosticApp()" x-init="init()">
    
    <header class="mb-8 border-b border-slate-200 pb-4">
      <h1 class="text-2xl font-bold text-slate-900">Diagnóstico de Productividad Empresarial y PTF</h1>
      <p class="text-sm text-slate-500 mt-1">Benchmarking sectorial y regional (32 actividades económicas × 26 regiones del Perú)</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- Formulario -->
      <div class="lg:col-span-5 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <form @submit.prevent="enviarFormulario">
          
          <h2 class="text-base font-semibold text-slate-800 mb-3">1. Clasificación Económica y Espacial</h2>
          <div class="space-y-3 mb-5">
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Actividad Económica</label>
              <select x-model="form.sector_id" required class="w-full text-xs border-slate-300 rounded-lg p-2 border focus:ring-2 focus:ring-blue-500">
                <template x-for="sector in catalogo.sectores" :key="sector.id">
                  <option :value="sector.id" x-text="sector.nombre"></option>
                </template>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Región</label>
              <select x-model="form.region" required class="w-full text-xs border-slate-300 rounded-lg p-2 border focus:ring-2 focus:ring-blue-500">
                <template x-for="reg in catalogo.regiones" :key="reg">
                  <option :value="reg" x-text="reg"></option>
                </template>
              </select>
            </div>
          </div>

          <h2 class="text-base font-semibold text-slate-800 mb-3">2. Variables de Producción Anuales</h2>
          <div class="space-y-3 mb-5">
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Ventas Totales Netas (S/.)</label>
              <input type="number" step="any" x-model.number="form.ventas_totales" required class="w-full text-sm border-slate-300 rounded-lg p-2 border">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Consumo Intermedio (S/.)</label>
              <input type="number" step="any" x-model.number="form.consumo_intermedio" required class="w-full text-sm border-slate-300 rounded-lg p-2 border">
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Trabajadores (L)</label>
                <input type="number" step="any" x-model.number="form.trabajadores" required class="w-full text-sm border-slate-300 rounded-lg p-2 border">
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Stock Capital (K) (S/.)</label>
                <input type="number" step="any" x-model.number="form.stock_capital" required class="w-full text-sm border-slate-300 rounded-lg p-2 border">
              </div>
            </div>
          </div>

          <!-- Ratios Financieros -->
          <div class="border-t border-slate-100 pt-4 mb-5">
            <button type="button" @click="mostrarFinanciero = !mostrarFinanciero" class="text-xs font-medium text-blue-600 hover:text-blue-700">
              <span x-text="mostrarFinanciero ? '− Ocultar Ratios Financieros' : '+ Agregar Ratios Financieros Opcionales'"></span>
            </button>

            <div x-show="mostrarFinanciero" class="mt-4 space-y-3">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs text-slate-500 mb-1">Activo Corriente</label>
                  <input type="number" step="any" x-model.number="form.activo_corriente" class="w-full text-sm border-slate-300 rounded-lg p-1.5 border">
                </div>
                <div>
                  <label class="block text-xs text-slate-500 mb-1">Pasivo Corriente</label>
                  <input type="number" step="any" x-model.number="form.pasivo_corriente" class="w-full text-sm border-slate-300 rounded-lg p-1.5 border">
                </div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs text-slate-500 mb-1">Activo Total</label>
                  <input type="number" step="any" x-model.number="form.activo_total" class="w-full text-sm border-slate-300 rounded-lg p-1.5 border">
                </div>
                <div>
                  <label class="block text-xs text-slate-500 mb-1">Patrimonio</label>
                  <input type="number" step="any" x-model.number="form.patrimonio" class="w-full text-sm border-slate-300 rounded-lg p-1.5 border">
                </div>
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">Utilidad Neta</label>
                <input type="number" step="any" x-model.number="form.utilidad_neta" class="w-full text-sm border-slate-300 rounded-lg p-1.5 border">
              </div>
            </div>
          </div>

          <button type="submit" :disabled="cargando" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm transition disabled:opacity-50">
            <span x-show="!cargando">Generar Diagnóstico</span>
            <span x-show="cargando">Procesando cálculo...</span>
          </button>
        </form>
      </div>

      <!-- Resultados -->
      <div class="lg:col-span-7 space-y-6">
        <div x-show="errorMsg" class="bg-rose-50 border border-rose-200 text-rose-700 text-sm p-4 rounded-xl" x-text="errorMsg"></div>

        <template x-if="resultados">
          <div>
            <div class="bg-slate-900 text-white p-5 rounded-xl mb-6 shadow-sm">
              <div class="flex justify-between items-start mb-3">
                <div>
                  <p class="text-xs uppercase tracking-wider text-slate-400">Valor Agregado Bruto (VAB)</p>
                  <p class="text-3xl font-bold mt-1 text-emerald-400" x-text="'S/. ' + formatNumber(resultados.vab)"></p>
                </div>
                <div class="text-right text-xs text-slate-300">
                  <span class="font-medium text-white" x-text="resultados.region_consultada"></span><br>
                  <span class="text-slate-400 text-[11px]" x-text="resultados.sector_nombre"></span>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
              <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="flex justify-between items-start">
                  <span class="text-xs font-semibold uppercase text-slate-400">Productividad Laboral (VAB / L)</span>
                  <span :class="badgeClass(resultados.productividad_laboral.brecha)" class="text-xs font-bold px-2 py-0.5 rounded-full" x-text="resultados.productividad_laboral.brecha + '%'"></span>
                </div>
                <p class="text-2xl font-bold text-slate-900 mt-2" x-text="'S/. ' + formatNumber(resultados.productividad_laboral.valor)"></p>
                <p class="text-xs text-slate-500 mt-1">Benchmark: S/. <span x-text="formatNumber(resultados.productividad_laboral.benchmark)"></span></p>
              </div>

              <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="flex justify-between items-start">
                  <span class="text-xs font-semibold uppercase text-slate-400">PTF (Cobb-Douglas)</span>
                  <span :class="badgeClass(resultados.ptf.brecha)" class="text-xs font-bold px-2 py-0.5 rounded-full" x-text="resultados.ptf.brecha + '%'"></span>
                </div>
                <p class="text-2xl font-bold text-slate-900 mt-2" x-text="formatNumber(resultados.ptf.valor)"></p>
                <p class="text-xs text-slate-500 mt-1">Benchmark: <span x-text="formatNumber(resultados.ptf.benchmark)"></span></p>
              </div>
            </div>

            <template x-if="resultados.financiero">
              <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <h3 class="text-sm font-semibold text-slate-800 mb-4">Ratios Financieros vs. Benchmark Sectorial</h3>
                <div class="space-y-4">
                  <template x-for="(metric, key) in resultados.financiero" :key="key">
                    <div>
                      <div class="flex justify-between text-xs font-medium mb-1">
                        <span class="capitalize text-slate-700" x-text="key.replace('_pct', ' (%)').replace('_', ' ')"></span>
                        <span :class="metric.brecha >= 0 ? 'text-emerald-600' : 'text-rose-600'" x-text="metric.brecha + '% vs sector'"></span>
                      </div>
                      <div class="flex items-center gap-3 text-xs text-slate-500">
                        <span>Empresa: <strong class="text-slate-800" x-text="metric.valor"></strong></span>
                        <span>|</span>
                        <span>Benchmark: <strong class="text-slate-800" x-text="metric.benchmark"></strong></span>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>

        <template x-if="!resultados && !cargando">
          <div class="bg-white p-12 rounded-xl border border-dashed border-slate-300 text-center text-slate-400">
            <p class="text-sm">Selecciona una actividad económica y región para generar el diagnóstico comparativo.</p>
          </div>
        </template>
      </div>

    </div>
  </div>

  <script>
    function diagnosticApp() {
      return {
        cargando: false,
        errorMsg: null,
        mostrarFinanciero: false,
        catalogo: { sectores: [], regiones: [] },
        form: {
          sector_id: 'SEC_16',
          region: 'Lima Metropolitana',
          ventas_totales: 850000,
          consumo_intermedio: 390000,
          trabajadores: 10,
          stock_capital: 520000,
          activo_corriente: 210000,
          pasivo_corriente: 110000,
          activo_total: 680000,
          patrimonio: 410000,
          utilidad_neta: 62000
        },
        resultados: null,
        async init() {
          try {
            const res = await fetch('/api/catalogo');
            this.catalogo = await res.json();
          } catch (e) {
            console.error('No se pudo cargar el catálogo de la API:', e);
          }
        },
        async enviarFormulario() {
          this.cargando = true;
          this.errorMsg = null;

          const payload = { ...this.form };
          if (!this.mostrarFinanciero) {
            delete payload.activo_corriente;
            delete payload.pasivo_corriente;
            delete payload.activo_total;
            delete payload.patrimonio;
            delete payload.utilidad_neta;
          }

          try {
            const response = await fetch('/api/diagnostico', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              const err = await response.json();
              throw new Error(err.detail || 'Error en el cálculo');
            }

            this.resultados = await response.json();
          } catch (err) {
            this.errorMsg = err.message;
            this.resultados = null;
          } finally {
            this.cargando = false;
          }
        },
        formatNumber(val) {
          return Number(val).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        },
        badgeClass(gap) {
          if (gap >= 5) return 'bg-emerald-100 text-emerald-700';
          if (gap <= -5) return 'bg-rose-100 text-rose-700';
          return 'bg-amber-100 text-amber-700';
        }
      }
    }
  </script>
</body>
</html>
